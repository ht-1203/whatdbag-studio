    <title>whatdbag Studio</title>
    <script>
      // GitHub Pages serves this for unknown paths under the site. Send the visitor
      // to the app root, keeping any auth params (#access_token=..., ?error=...).
      var base = '/' + location.pathname.split('/')[1] + '/';
      location.replace(base + location.search + location.hash);
    </script>
